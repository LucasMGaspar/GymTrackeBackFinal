<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Usuário Personal Trainer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .result.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .warning strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Criar Usuário Personal Trainer</h1>
        <p class="subtitle">Preencha os dados abaixo para criar seu usuário</p>

        <div class="warning">
            <strong>⚠️ Importante:</strong>
            Certifique-se de que o servidor está rodando (npm run dev) antes de criar o usuário.
        </div>

        <form id="createUserForm">
            <div class="form-group">
                <label for="email">Email *</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="seu@email.com" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Senha *</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Mínimo 6 caracteres" 
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label for="name">Nome *</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="Seu Nome" 
                    required
                >
            </div>

            <button type="submit" id="submitBtn">
                Criar Usuário Personal Trainer
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">Criando usuário...</p>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        const form = document.getElementById('createUserForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;

            // Mostrar loading
            submitBtn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';

            try {
                const response = await fetch('http://localhost:3000/api/admin/create-first-user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email,
                        password,
                        name,
                    }),
                });

                const data = await response.json();

                // Esconder loading
                loading.style.display = 'none';
                submitBtn.disabled = false;

                // Mostrar resultado
                result.style.display = 'block';

                if (response.ok) {
                    result.className = 'result success';
                    result.innerHTML = `
                        <strong>✅ Sucesso!</strong><br>
                        Usuário criado com sucesso!<br><br>
                        <strong>Detalhes:</strong><br>
                        Email: ${data.user.email}<br>
                        Nome: ${data.user.name}<br>
                        Role: ${data.user.role}<br><br>
                        <strong>Próximos passos:</strong><br>
                        1. Faça login na aplicação com este email e senha<br>
                        2. Você será redirecionado para /app/personal<br>
                        3. <strong>DELETE o arquivo app/api/admin/create-first-user/route.ts</strong>
                    `;
                } else {
                    result.className = 'result error';
                    result.innerHTML = `
                        <strong>❌ Erro!</strong><br>
                        ${data.error || 'Erro desconhecido'}<br>
                        ${data.details ? `<br>Detalhes: ${data.details}` : ''}
                    `;
                }
            } catch (error) {
                loading.style.display = 'none';
                submitBtn.disabled = false;
                result.style.display = 'block';
                result.className = 'result error';
                result.innerHTML = `
                    <strong>❌ Erro de conexão!</strong><br>
                    Não foi possível conectar ao servidor.<br><br>
                    <strong>Verifique:</strong><br>
                    1. O servidor está rodando? (npm run dev)<br>
                    2. A URL está correta? (http://localhost:3000)<br>
                    <br>
                    Erro: ${error.message}
                `;
            }
        });
    </script>
</body>
</html>
