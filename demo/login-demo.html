<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo - Login | Personal Trainer SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 px-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow-xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">
                Personal Trainer
            </h1>
            <p class="text-gray-600">
                Entre com seu email para receber o link de acesso
            </p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    Email
                </label>
                <input
                    id="email"
                    type="email"
                    value=""
                    required
                    placeholder="seu@email.com"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                />
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition"
            >
                Enviar link mágico
            </button>
        </form>

        <div id="message" class="mt-6 p-4 rounded-lg hidden">
            <p class="text-sm"></p>
        </div>

        <div class="mt-8 text-center text-sm text-gray-600">
            <p>
                Acesso sem senha. Você receberá um link mágico por email.
            </p>
        </div>
    </div>

    <!-- Demo Info Banner -->
    <div class="fixed bottom-4 left-4 right-4 bg-blue-600 text-white p-4 rounded-lg shadow-lg max-w-md mx-auto">
        <p class="text-sm font-semibold mb-1">🔐 Demo - Login Magic Link</p>
        <p class="text-xs opacity-90">
            Esta é uma prévia estática da interface de login. A versão real envia um link por email via Supabase Auth.
        </p>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');
        const messageText = messageDiv.querySelector('p');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            // Simulate sending
            const button = form.querySelector('button');
            button.textContent = 'Enviando...';
            button.disabled = true;

            setTimeout(() => {
                button.textContent = 'Enviar link mágico';
                button.disabled = false;

                messageDiv.classList.remove('hidden', 'bg-red-50', 'text-red-800', 'border-red-200');
                messageDiv.classList.add('bg-green-50', 'text-green-800', 'border', 'border-green-200');
                messageText.textContent = `✓ Link mágico enviado para ${email}! Verifique seu email.`;

                document.getElementById('email').value = '';
            }, 1500);
        });
    </script>
</body>
</html>
